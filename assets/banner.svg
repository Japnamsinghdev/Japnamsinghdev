<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Sardar Japnam Singh Lall - Full Stack Web Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="orbBlue" cx="82%" cy="35%" r="42%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1326" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="18%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="340" rx="18" fill="url(#orbBlue)"/>
  <rect width="1200" height="340" rx="18" fill="url(#orbPurple)"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left Content -->
  <g transform="translate(56, 58)">
    <rect x="0" y="0" width="318" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="18" cy="15" r="4.5" fill="#22c55e"/>
    <text x="32" y="19" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">OPEN TO FULL STACK DEVELOPER ROLES</text>

    <text x="0" y="96" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.8">Sardar Japnam Singh Lall</text>
    <rect x="0" y="114" width="210" height="4.5" rx="2.25" fill="url(#accentGrad)"/>

    <text x="0" y="156" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">Full Stack Web Developer</text>
    <text x="0" y="186" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">Java · Spring Boot · React · TypeScript · SQL &amp; NoSQL · Docker</text>

    <g transform="translate(0, 214)">
      <rect x="0" y="0" width="124" height="28" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
      <text x="62" y="18" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600">Frontend UI</text>

      <rect x="136" y="0" width="126" height="28" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
      <text x="199" y="18" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600">Backend APIs</text>

      <rect x="274" y="0" width="126" height="28" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
      <text x="337" y="18" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600">Clean Code</text>
    </g>
  </g>

  <!-- Right Glass Stack Card -->
  <g transform="translate(740, 44)">
    <rect x="0" y="0" width="404" height="252" rx="14" fill="#0b1120" fill-opacity="0.88" stroke="url(#cardStroke)" stroke-width="1.3"/>

    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="37" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="19" r="5" fill="#22c55e"/>
    <text x="382" y="23" text-anchor="end" fill="#64748b" font-family="Consolas, Monaco, monospace" font-size="11">developer.stack</text>
    <line x1="0" y1="36" x2="404" y2="36" stroke="#1e293b" stroke-width="1"/>

    <rect x="22" y="54" width="360" height="48" rx="9" fill="#111827" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="38" y="75" fill="#38bdf8" font-family="Consolas, Monaco, monospace" font-size="11" font-weight="700">FRONTEND</text>
    <text x="38" y="93" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="600">React · TypeScript · JavaScript · Tailwind</text>

    <rect x="22" y="116" width="360" height="48" rx="9" fill="#131c31" stroke="#818cf8" stroke-opacity="0.65" stroke-width="1.3"/>
    <text x="38" y="137" fill="#a5b4fc" font-family="Consolas, Monaco, monospace" font-size="11" font-weight="700">BACKEND</text>
    <text x="38" y="155" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="600">Java · Spring Boot · Spring Security · REST</text>

    <rect x="22" y="178" width="360" height="48" rx="9" fill="#0f172a" stroke="#6ee7b7" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="38" y="199" fill="#6ee7b7" font-family="Consolas, Monaco, monospace" font-size="11" font-weight="700">DATABASE &amp; TOOLS</text>
    <text x="38" y="217" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="600">PostgreSQL · MySQL · MongoDB · Docker · Git</text>
  </g>
</svg>
